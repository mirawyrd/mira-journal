<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A neutral technical pilot for Mira Journal.">
  <title>Mira Journal — Technical pilot</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #20352f; background: #f4f3ed; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 3rem, 44rem); margin: clamp(3rem, 12vh, 8rem) auto; border-top: 3px solid #36564b; padding-top: 1.5rem; }
    .label { font-size: .75rem; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 2rem 0 1rem; font: 500 clamp(2.6rem, 8vw, 4.5rem)/1.1 Georgia, serif; letter-spacing: -.04em; }
    p { max-width: 36rem; font-size: 1.1rem; line-height: 1.7; }
    article { margin-top: 2.5rem; padding: 1.5rem; border: 1px solid #b8c3b9; background: #fafaf6; }
    h2 { margin: 0 0 .75rem; font-size: 1.1rem; }
    article p { margin: 0; font-size: 1rem; }
    footer { margin-top: 3rem; font-size: .85rem; line-height: 1.8; color: #4b6057; }
    a { color: inherit; text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="label">Technical pilot · 01</div>
      <h1>Mira Journal</h1>
      <p>A small test page for a journal in preparation.</p>
    </header>
    <article aria-labelledby="test-title">
      <h2 id="test-title">Test entry</h2>
      <p>This is neutral sample text for checking publication, readability and layout across screen sizes.</p>
    </article>
    <footer>
      <time datetime="2026-10-04">4 October 2026</time> · GitHub Pages pilot<br>
      <a href="https://github.com/mirawyrd/mira-journal">View the repository</a>
    </footer>
  </main>
</body>
</html>
